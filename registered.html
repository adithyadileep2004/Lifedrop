<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registered Donors | LifeDrop</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .donor-list {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            overflow-x: auto;
        }

        .donor-list h1 {
            text-align: center;
            color: #c62828;
        }

        .donor-count {
            font-weight: bold;
            margin-top: 25px;
        }

        .button-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .print-btn {
            background-color: #c62828;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .print-btn:hover {
            background-color: #a31515;
        }

        .donor-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        .donor-table th,
        .donor-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .donor-table th {
            background-color: #c62828;
            color: white;
        }

        .donor-table tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .delete-btn {
            background-color: #c62828;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #c62828;
            text-decoration: none;
            font-weight: bold;
        }

        #emptyMessage {
            text-align: center;
            margin-top: 25px;
        }

        /* Print settings */
        @media print {
            body {
                background: white !important;
                color: black !important;
                font-family: Arial, sans-serif;
            }

            .donor-list {
                max-width: 100%;
                margin: 0;
                padding: 0;
                overflow: visible;
            }

            .donor-list h1 {
                color: black !important;
                text-align: center;
                font-size: 24px;
            }

            .button-container,
            .delete-btn,
            .back-link {
                display: none !important;
            }

            .donor-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
                font-size: 11px;
            }

            .donor-table th,
            .donor-table td {
                border: 1px solid black !important;
                padding: 8px;
                color: black !important;
                overflow-wrap: anywhere;
            }

            .donor-table th {
                background: #eeeeee !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }

            .donor-table tr {
                break-inside: avoid;
            }

            .donor-count {
                color: black !important;
            }

            #emptyMessage {
                color: black !important;
            }
        }

        @page {
            size: A4 landscape;
            margin: 12mm;
        }
    </style>
</head>

<body>

    <section class="donor-list">

        <h1>LifeDrop Registered Donors</h1>

        <p id="donorCount" class="donor-count">
            Total registered donors: 0
        </p>

        <div class="button-container">
            <button
                type="button"
                class="print-btn"
                onclick="window.print()">
                🖨️ Print Donor List
            </button>
        </div>

        <table class="donor-table">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Blood Group</th>
                    <th>City</th>
                    <th class="action-heading">Action</th>
                </tr>
            </thead>

            <tbody id="donorTableBody"></tbody>

        </table>

        <p id="emptyMessage" hidden>
            No donors registered yet.
        </p>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </section>

    <script>
        function displayDonors() {

            const donors = JSON.parse(
                localStorage.getItem("lifedropDonors") || "[]"
            );

            const tableBody =
                document.getElementById("donorTableBody");

            const emptyMessage =
                document.getElementById("emptyMessage");

            const donorCount =
                document.getElementById("donorCount");

            tableBody.replaceChildren();

            donorCount.textContent =
                "Total registered donors: " + donors.length;

            emptyMessage.hidden = donors.length !== 0;

            donors.forEach(function(donor) {

                const row = document.createElement("tr");

                [
                    donor.name,
                    donor.email,
                    donor.phone,
                    donor.blood,
                    donor.city
                ].forEach(function(value) {

                    const cell = document.createElement("td");

                    cell.textContent = value || "";

                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");
                actionCell.className = "action-cell";

                const deleteButton =
                    document.createElement("button");

                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";
                deleteButton.type = "button";

                deleteButton.addEventListener("click", function() {

                    if (confirm("Delete this donor record?")) {

                        const currentDonors = JSON.parse(
                            localStorage.getItem("lifedropDonors") || "[]"
                        );

                        const updatedDonors = currentDonors.filter(
                            function(item) {
                                return item.id !== donor.id;
                            }
                        );

                        localStorage.setItem(
                            "lifedropDonors",
                            JSON.stringify(updatedDonors)
                        );

                        displayDonors();
                    }
                });

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);

                tableBody.appendChild(row);
            });
        }

        // Hide the Action column when printing
        const printStyle = document.createElement("style");

        printStyle.textContent = `
            @media print {
                .action-heading,
                .action-cell {
                    display: none !important;
                }
            }
        `;

        document.head.appendChild(printStyle);

        displayDonors();
    </script>

</body>
</html>
