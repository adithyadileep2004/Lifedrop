<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registered Donors | LifeDrop</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .donor-list {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            overflow-x: auto;
        }

        .donor-list h1 {
            text-align: center;
            color: #c62828;
        }

        .donor-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        .donor-table th,
        .donor-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .donor-table th {
            background-color: #c62828;
            color: white;
        }

        .donor-table tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .delete-btn {
            background-color: #c62828;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #c62828;
            text-decoration: none;
            font-weight: bold;
        }

        #emptyMessage {
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <section class="donor-list">

        <h1>LifeDrop Registered Donors</h1>

        <p id="donorCount">Total registered donors: 0</p>

        <table class="donor-table">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Blood Group</th>
                    <th>City</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="donorTableBody"></tbody>

        </table>

        <p id="emptyMessage" hidden>
            No donors registered yet.
        </p>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </section>

    <script>
        function displayDonors() {

            const donors = JSON.parse(
                localStorage.getItem("lifedropDonors") || "[]"
            );

            const tableBody =
                document.getElementById("donorTableBody");

            const emptyMessage =
                document.getElementById("emptyMessage");

            const donorCount =
                document.getElementById("donorCount");

            tableBody.replaceChildren();

            donorCount.textContent =
                "Total registered donors: " + donors.length;

            emptyMessage.hidden = donors.length !== 0;

            donors.forEach(function(donor) {

                const row = document.createElement("tr");

                [
                    donor.name,
                    donor.email,
                    donor.phone,
                    donor.blood,
                    donor.city
                ].forEach(function(value) {

                    const cell = document.createElement("td");

                    cell.textContent = value || "";

                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");

                const deleteButton =
                    document.createElement("button");

                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";

                deleteButton.addEventListener("click", function() {

                    if (confirm("Delete this donor record?")) {

                        const updatedDonors = donors.filter(
                            item => item.id !== donor.id
                        );

                        localStorage.setItem(
                            "lifedropDonors",
                            JSON.stringify(updatedDonors)
                        );

                        displayDonors();
                    }
                });

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);

                tableBody.appendChild(row);

            });
        }

        displayDonors();
    </script>

</body>

</html>
